<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAMSTARS ABM OS</title>
<style>
/* ============================================================
   ZAMSTARS ABM OS
   Single-file application. No external dependencies.
   Colour tokens come from content/brand.js in the ZAMSTARS Operating
   Playbook. Change them in :root only.
   ============================================================ */

:root{
  --ink:#30302F; --ink2:#4A4A48; --ink3:#6E6E6B;
  --pink:#CA366A; --violet:#5B3FA8; --gold:#F5B62C; --teal:#12A594;
  --paper:#F8F7F7; --line:#E4E3E3; --white:#fff;
  --pink-soft:rgba(202,54,106,.08); --violet-soft:rgba(91,63,168,.08);
  --gold-soft:rgba(245,182,44,.14); --teal-soft:rgba(18,165,148,.10);
  /* Two quiet washes so you can tell at a glance what is yours to fill in
     and what the app has worked out. Cream means type here. Pale green means
     this was calculated, so changing it means changing something upstream. */
  --in-bg:#FFFCF4; --in-line:#EDE1C7; --in-line2:#E2CFA4;
  --calc-bg:#F4FAF8; --calc-line:#D8EAE6; --calc-ink:#0E6B60;
  --rail:264px; --top:60px;
  --sh:0 1px 2px rgba(48,48,47,.06),0 4px 14px rgba(48,48,47,.05);
  --sh2:0 10px 40px rgba(48,48,47,.14);
  --r:10px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans); font-size:13.5px; line-height:1.55;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink)}
::selection{background:var(--gold-soft)}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(48,48,47,.18);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:rgba(48,48,47,.32)}

/* ============================================================ SHELL */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}

/* ---------- left rail ---------- */
#rail{
  background:var(--ink); color:#EDEDEC; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.brandbar{
  padding:16px 18px 14px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.star{width:19px;height:19px;color:var(--pink);flex:0 0 auto}
.star svg{width:100%;height:100%;display:block}
.brandbar .t1{font-weight:700;letter-spacing:.10em;font-size:11.5px}
.brandbar .t2{font-size:9.5px;letter-spacing:.16em;color:rgba(237,237,236,.5);margin-top:1px}

.railscroll{flex:1;overflow-y:auto;padding:12px 10px 20px}
.railgroup{margin-bottom:16px}
.railgroup h4{
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(237,237,236,.38); margin:0 0 7px 9px; font-weight:700;
}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;text-align:left;color:rgba(237,237,236,.76);
  padding:7px 9px;border-radius:8px;font-size:12.5px;line-height:1.3;
  transition:background .13s,color .13s; position:relative;
}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.on{background:var(--pink);color:#fff;font-weight:600}
.navitem.on .nx{background:rgba(255,255,255,.26);color:#fff;border-color:transparent}
.nx{
  flex:0 0 auto;width:19px;height:19px;border-radius:5px;
  display:grid;place-items:center;font-size:9.5px;font-weight:700;
  background:rgba(255,255,255,.07);color:rgba(237,237,236,.6);
  border:1px solid rgba(255,255,255,.09); font-family:var(--mono);
}
.navitem .nlab{flex:1;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.16)}
.dot.done{background:var(--teal)}
.dot.part{background:var(--gold)}

.railfoot{
  border-top:1px solid rgba(255,255,255,.09);padding:11px 12px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.railfoot button{
  flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:rgba(237,237,236,.85);border-radius:7px;padding:6px 4px;font-size:10.5px;font-weight:600;
  letter-spacing:.02em;transition:.13s;
}
.railfoot button:hover{background:rgba(255,255,255,.15);color:#fff}

.readiness{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09)}
.readiness .rlab{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,237,236,.4);font-weight:700}
.rbar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:7px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .5s cubic-bezier(.4,0,.2,1)}
.readiness .rnum{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.readiness .rnum small{font-size:10px;font-weight:500;color:rgba(237,237,236,.45)}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}

#topbar{
  height:var(--top);flex:0 0 auto;background:var(--white);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:10px;padding:0 18px;z-index:20;
}
.clientpick{
  display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:5px 8px 5px 6px;
}
.clogo{
  width:28px;height:28px;border-radius:7px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em;flex:0 0 auto;
}
.clientpick select{
  border:0;background:none;font-weight:650;font-size:13px;padding:0 2px;
  max-width:190px;outline:none;cursor:pointer;
}
.urlwrap{display:flex;align-items:center;gap:0;flex:1;max-width:420px}
.urlwrap input{
  flex:1;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;
  padding:7px 10px;background:var(--white);outline:none;font-size:12.5px;color:var(--ink2);
}
.urlwrap input:focus{border-color:var(--violet);box-shadow:-1px 0 0 var(--violet) inset}
.urlwrap button{
  border:1px solid var(--violet);background:var(--violet);color:#fff;
  border-radius:0 8px 8px 0;padding:7px 12px;font-size:11.5px;font-weight:650;white-space:nowrap;
}
.urlwrap button:hover{filter:brightness(1.12)}
.urlwrap button:disabled{opacity:.55;cursor:wait}
.beta{
  font-size:8.5px;font-weight:800;letter-spacing:.1em;background:var(--gold-soft);
  color:#8a6206;border:1px solid rgba(245,182,44,.5);border-radius:4px;padding:2px 4px;margin-left:6px;
}
.spacer{flex:1}
.tbtn{
  background:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:7px 11px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink3);color:var(--ink)}
.tbtn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn.pri:hover{background:#1e1e1d}
.tbtn.pk{background:var(--pink);border-color:var(--pink);color:#fff}
.tbtn.pk:hover{filter:brightness(1.1)}

#stagehead{
  flex:0 0 auto;background:var(--white);border-bottom:1px solid var(--line);
  padding:16px 26px 14px;
}
.shrow{display:flex;align-items:flex-start;gap:14px}
.shnum{
  width:34px;height:34px;border-radius:9px;background:var(--pink-soft);color:var(--pink);
  border:1px solid rgba(202,54,106,.22);display:grid;place-items:center;
  font-weight:800;font-size:13px;font-family:var(--mono);flex:0 0 auto;margin-top:1px;
}
#stagehead h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
#stagehead .sub{margin:4px 0 0;font-size:12.5px;color:var(--ink3);max-width:78ch;line-height:1.5}
.vgtag{
  display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-top:8px;
}
.vg-acq{background:var(--pink-soft);color:var(--pink)}
.vg-exp{background:var(--violet-soft);color:var(--violet)}
.vg-ret{background:var(--teal-soft);color:#0d7d70}
.vg-adv{background:var(--gold-soft);color:#8a6206}
.vg-all{background:rgba(48,48,47,.07);color:var(--ink2)}

#canvas{flex:1;overflow-y:auto;padding:22px 26px 90px;scroll-behavior:smooth}
.wrap{max-width:1240px}

/* ---------- cards & primitives ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>header h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.card>header .hint{font-size:11.5px;color:var(--ink3);font-weight:400}
.card .body{padding:16px}
.card .body.tight{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1180px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.f{margin-bottom:13px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.inp,textarea.inp,select.inp{
  width:100%;border:1px solid var(--in-line);border-radius:8px;padding:8px 10px;
  background:var(--in-bg);outline:none;transition:border-color .13s,box-shadow .13s;font-size:13px;
}
.inp:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 3px rgba(245,182,44,.16)}
.inp::placeholder,textarea.inp::placeholder{color:#B9A77E}
textarea.inp{resize:vertical;min-height:66px;line-height:1.55}
select.inp{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='%23997A3F' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px}
.hlp{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--paper);
  border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11.5px;color:var(--ink2);
}
.chip b{font-weight:650}
.chip button{background:none;border:0;color:var(--ink3);padding:0 0 0 1px;font-size:13px;line-height:1;opacity:.6}
.chip button:hover{opacity:1;color:var(--pink)}
.chip.add{border-style:dashed;cursor:pointer;color:var(--ink3)}
.chip.add:hover{border-color:var(--pink);color:var(--pink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.pk{background:var(--pink-soft);border-color:rgba(202,54,106,.3);color:var(--pink)}
.chip.vi{background:var(--violet-soft);border-color:rgba(91,63,168,.3);color:var(--violet)}
.chip.te{background:var(--teal-soft);border-color:rgba(18,165,148,.3);color:#0d7d70}
.chip.go{background:var(--gold-soft);border-color:rgba(245,182,44,.45);color:#8a6206}

.pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.t1p{background:var(--gold-soft);color:#8a6206;border:1px solid rgba(245,182,44,.5)}
.t2p{background:var(--violet-soft);color:var(--violet);border:1px solid rgba(91,63,168,.28)}
.t3p{background:rgba(48,48,47,.07);color:var(--ink2);border:1px solid var(--line)}
.okp{background:var(--teal-soft);color:#0d7d70;border:1px solid rgba(18,165,148,.3)}
.wrp{background:var(--gold-soft);color:#8a6206;border:1px solid rgba(245,182,44,.5)}
.bap{background:var(--pink-soft);color:var(--pink);border:1px solid rgba(202,54,106,.28)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:2;white-space:nowrap;
}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:rgba(202,54,106,.028)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.scrollx{overflow-x:auto}
/* a cell the app worked out, not one you type in */
td.calc{background:var(--calc-bg)}
.tbl tbody tr:hover td.calc{background:#EDF6F4}
.calcbox{background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:9px;padding:12px 14px}
.inbox{background:var(--in-bg);border:1px solid var(--in-line);border-radius:9px;padding:12px 14px}
.ce{
  border:1px solid transparent;border-radius:6px;padding:3px 5px;min-width:40px;
  background:var(--in-bg);outline:none;width:100%;font-size:12.5px;line-height:1.45;
}
.ce:hover{border-color:var(--in-line)}
.ce:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 3px rgba(245,182,44,.16)}
.ce::placeholder{color:#BCAB84}
td.ta .ce{white-space:pre-wrap;min-height:22px}
.mini{
  border:1px solid var(--in-line);border-radius:6px;padding:3px 5px;background:var(--in-bg);
  font-size:11.5px;outline:none;max-width:100%;
}
.mini:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 2px rgba(245,182,44,.16)}
.xbtn{background:none;border:0;color:var(--ink3);opacity:.45;font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
.xbtn:hover{opacity:1;color:var(--pink);background:var(--pink-soft)}
.addrow{
  width:100%;background:var(--paper);border:0;border-top:1px dashed var(--line);
  padding:9px;font-size:12px;font-weight:650;color:var(--ink3);border-radius:0 0 var(--r) var(--r);
}
.addrow:hover{background:var(--pink-soft);color:var(--pink)}

/* ---------- metric tiles ---------- */
.tile{background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.tile .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.tile .v{font-size:25px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.1}
.tile .d{font-size:11px;color:var(--ink3);margin-top:2px}
.tile.pk{border-left:3px solid var(--pink)}
.tile.vi{border-left:3px solid var(--violet)}
.tile.te{border-left:3px solid var(--teal)}
.tile.go{border-left:3px solid var(--gold)}

/* ---------- journey ---------- */
.jflow{display:flex;gap:0;overflow-x:auto;padding:4px 0 12px}
.jnode{
  flex:0 0 auto;min-width:132px;max-width:170px;background:var(--white);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;position:relative;
  margin-right:16px;box-shadow:var(--sh);cursor:pointer;transition:.14s;
}
.jnode:last-child{margin-right:0}
.jnode:after{
  content:'';position:absolute;right:-16px;top:50%;width:16px;height:1.5px;
  background:var(--line);
}
.jnode:last-child:after{display:none}
.jnode:hover{border-color:var(--pink);transform:translateY(-1px)}
.jnode.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft),var(--sh)}
.jnode .jn{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--ink3);font-family:var(--mono)}
.jnode .jt{font-size:12px;font-weight:680;line-height:1.3;margin-top:3px}
.jnode .jm{font-size:10.5px;color:var(--ink3);margin-top:4px;line-height:1.35}
.jnode .jvg{position:absolute;top:0;left:11px;right:11px;height:2.5px;border-radius:0 0 3px 3px}

.lens{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lens .lab{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* ---------- signoff bar ---------- */
.signoff{
  background:linear-gradient(180deg,#fff,var(--paper));border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:16px;
}
.signoff .sohead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.signoff .sohead b{font-size:12.5px}
.soflag{
  width:22px;height:22px;border-radius:6px;background:var(--pink-soft);color:var(--pink);
  display:grid;place-items:center;font-size:12px;flex:0 0 auto;
}
.sorow{display:flex;gap:10px;align-items:flex-start}
.sorow textarea{flex:1}
.toggle{
  display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;font-size:12px;font-weight:650;color:var(--ink3);white-space:nowrap;
  align-self:stretch;
}
.toggle:hover{border-color:var(--teal);color:#0d7d70}
.toggle.on{background:var(--teal);border-color:var(--teal);color:#fff}
.toggle .tk{
  width:15px;height:15px;border-radius:4px;border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:10px;flex:0 0 auto;
}
.toggle.on .tk{background:#fff;color:var(--teal);border-color:#fff}

/* ---------- the two-colour key ---------- */
.keylegend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto;padding-top:3px}
.kl{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;
  color:var(--ink3);border-radius:20px;padding:3px 10px 3px 7px;white-space:nowrap;
}
.kl i{width:10px;height:10px;border-radius:3px;display:block;flex:0 0 auto}
.kl-in{background:var(--in-bg);border:1px solid var(--in-line)}
.kl-in i{background:#fff;border:1px solid var(--in-line2)}
.kl-calc{background:var(--calc-bg);border:1px solid var(--calc-line)}
.kl-calc i{background:#CFE7E2;border:1px solid var(--calc-line)}

/* ---------- callout ---------- */
.co{border-left:3px solid var(--violet);background:var(--violet-soft);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.co b{font-weight:700}
.co.pk{border-color:var(--pink);background:var(--pink-soft)}
.co.go{border-color:var(--gold);background:var(--gold-soft)}
.co.te{border-color:var(--teal);background:var(--teal-soft)}
.co .cot{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.8}

/* ---------- score bars ---------- */
.sb{display:flex;align-items:center;gap:7px;min-width:96px}
.sb .track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.sb .track i{display:block;height:100%;border-radius:3px;transition:width .3s}
.sb .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;width:20px;text-align:right;color:var(--ink2)}
.rng{width:74px;accent-color:var(--pink);cursor:pointer;vertical-align:middle}

/* ---------- heatmap ---------- */
.hm{border-collapse:separate;border-spacing:3px;font-size:11px}
.hm th{background:transparent;border:0;padding:3px 6px;font-size:9px;position:static}
.hm td{border:0;padding:0}
.hmc{
  width:100%;min-width:52px;height:34px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);
}

/* ---------- funnel ---------- */
.fun{display:flex;flex-direction:column;gap:4px}
.funrow{display:flex;align-items:center;gap:10px}
.funrow .fl{width:150px;font-size:11.5px;color:var(--ink2);text-align:right;flex:0 0 auto;line-height:1.25}
.funrow .fbar{flex:1;height:26px;background:var(--paper);border-radius:5px;overflow:hidden;position:relative}
.funrow .fbar i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.funrow .fbar span{position:absolute;left:8px;top:0;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;font-family:var(--mono);color:var(--ink)}
.funrow .fn{width:34px;font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink3);flex:0 0 auto}

/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:rgba(48,48,47,.42);display:none;z-index:200;backdrop-filter:blur(2px)}
#mask.on{display:grid;place-items:center;padding:24px}
.modal{background:var(--white);border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:600px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:15px;font-weight:700}
.modal .mb{padding:20px;overflow-y:auto;flex:1}
.modal footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--paper)}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;font-weight:600;
  box-shadow:var(--sh2);z-index:300;transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:min(520px,90vw);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- presenter footer ---------- */
#pfoot{
  position:fixed;bottom:0;left:var(--rail);right:0;height:0;overflow:hidden;
  background:var(--ink);color:#EDEDEC;transition:height .25s;z-index:30;
}
#pfoot.on{height:auto;min-height:52px;padding:12px 26px 13px}
#pfoot .pt{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
#pfoot .pc{font-size:12.5px;line-height:1.5;max-width:120ch;color:rgba(237,237,236,.9)}
#pfoot .px{position:absolute;top:10px;right:20px;background:none;border:0;color:rgba(237,237,236,.5);font-size:16px}
#pfoot .px:hover{color:#fff}

/* ---------- misc ---------- */
.muted{color:var(--ink3)}
.tiny{font-size:11px}
.mono{font-family:var(--mono)}
.rowend{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:32px 20px;text-align:center;color:var(--ink3);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.kv dd{margin:0}
.bignum{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.persona{border:1px solid var(--line);border-radius:9px;padding:13px;background:var(--white);position:relative}
.persona .ph{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.pav{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:0 0 auto}
.persona h4{margin:0;font-size:13px;font-weight:700;line-height:1.25}
.persona .prole{font-size:10.5px;color:var(--ink3);margin-top:1px}
.pfield{margin-bottom:8px}
.pfield .pl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.play{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--white);transition:.14s;position:relative}
.play.off{opacity:.5;background:var(--paper)}
.play .phd{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px}
.play h4{margin:0;font-size:12.5px;font-weight:680;line-height:1.3;flex:1}
.play .pd{font-size:11.5px;color:var(--ink3);line-height:1.45}
.play .pm{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.sw{width:34px;height:19px;border-radius:11px;background:var(--line);position:relative;border:0;flex:0 0 auto;transition:.16s}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--teal)}
.sw.on:after{left:17px}
.wkcol{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.ph1{border-color:var(--pink)}.ph2{border-color:var(--violet)}.ph3{border-color:var(--teal)}
.pjump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pjump button{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:650;color:var(--ink3)}
.pjump button:hover,.pjump button.on{border-color:var(--pink);color:var(--pink);background:var(--pink-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2.5px;margin-right:4px;vertical-align:-1px}
/* ---------- executive summary ---------- */
.hero{
  background:var(--ink);color:#EDEDEC;border-radius:14px;padding:0;margin-bottom:22px;
  position:relative;overflow:hidden;
  box-shadow:0 18px 50px rgba(48,48,47,.20);
}
.hero:after{content:'';position:absolute;top:-90px;right:-60px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(202,54,106,.34),transparent 68%);pointer-events:none}
.herogrid{display:grid;grid-template-columns:1.4fr .85fr;gap:0;position:relative;z-index:1}
@media(max-width:1080px){.herogrid{grid-template-columns:1fr}}
.heroL{padding:28px 30px 26px}
.heroR{
  padding:28px 30px 26px;border-left:1px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;
}
@media(max-width:1080px){.heroR{border-left:0;border-top:1px solid rgba(255,255,255,.09)}}

/* client lockup */
.lockup{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lockup .cmark{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:6px 11px 6px 8px;
}
.lockup .cmark img{height:19px;width:auto;display:block;filter:brightness(0) invert(1)}
.lockup .cmark b{font-size:14px;font-weight:750;letter-spacing:-.01em}
.lockup .xsep{color:rgba(237,237,236,.32);font-size:13px}
.lockup .zmark{display:flex;align-items:center;gap:6px;color:rgba(237,237,236,.72)}
.lockup .zmark .star{width:13px;height:13px;color:var(--pink)}
.lockup .zmark span{font-size:10.5px;font-weight:800;letter-spacing:.13em}

.hero .hk{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:9px}
.hero .hmeta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:11.5px;color:rgba(237,237,236,.6)}
.hero .hmeta b{color:rgba(237,237,236,.9);font-weight:650}
.editbtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:rgba(237,237,236,.7);
  border-radius:7px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;margin-top:14px;
}
.editbtn:hover{background:rgba(255,255,255,.15);color:#fff}

/* the estate: one tile per building, and the dim ones are dead zones */
.estatewrap{position:relative}
.estate{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:250px}
.estate i{
  display:block;aspect-ratio:1/1;border-radius:2.5px;background:rgba(18,165,148,.72);
  animation:lit .9s ease-out backwards;
}
.estate i.dim{background:rgba(255,255,255,.10)}
.estate i.dead{background:rgba(202,54,106,.85);animation:pulse 2.8s ease-in-out infinite}
@keyframes lit{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.estatelegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:10.5px;color:rgba(237,237,236,.6)}
.estatelegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hero .opchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.hero .opchips span{
  font-size:9.5px;font-weight:750;letter-spacing:.06em;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:3px 7px;color:rgba(237,237,236,.75);
}

/* proof strip */
.proofstrip{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;box-shadow:var(--sh);margin-bottom:22px;
}
.proofstrip .pslab{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.proofstrip .pl{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--paper);
}
.proofstrip .pl img{height:14px;width:auto;display:block;opacity:.8}
.proofstrip .pl .dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}

/* stat card system */
.scards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
@media(max-width:1080px){.scards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.scards{grid-template-columns:1fr}}
.sc{
  background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;
}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(48,48,47,.10)}
.sc.wide{grid-column:span 2}
@media(max-width:680px){.sc.wide{grid-column:span 1}}
.sc .sck{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sc .scv{font-size:30px;font-weight:750;letter-spacing:-.035em;line-height:1.05;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.sc .scv small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}
.sc .scd{font-size:11px;color:var(--ink3);line-height:1.45}
.sc .scicon{position:absolute;top:13px;right:14px;font-size:15px;opacity:.20}
.sc.ring{display:flex;align-items:center;gap:14px}
.sc.ring .rtxt{flex:1;min-width:0}
.sc .tierbar{display:flex;gap:3px;margin-top:7px;height:6px}
.sc .tierbar i{display:block;border-radius:2px}
.sc .segdots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.sc .segdots i{width:7px;height:7px;border-radius:50%;display:block}

/* section divider, which is really just the breathing room */
.divider{display:flex;align-items:center;gap:14px;margin:34px 0 18px}
.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}
.divider span{
  font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;
}
.divider.tight{margin:26px 0 16px}
/* The thesis is the first thing said out loud in the room, so let it run the
   full width of the canvas rather than wrapping into a narrow column. */
.hero h2{
  margin:10px 0 0; font-weight:700; letter-spacing:-.022em;
  font-size:clamp(19px,1.95vw,28px); line-height:1.32;
  max-width:none; padding-right:64px; position:relative; text-wrap:pretty;
}
@media(max-width:900px){ .hero h2{padding-right:0} }
.hero .hs{margin-top:11px;font-size:13.5px;line-height:1.6;color:rgba(237,237,236,.82);max-width:82ch;position:relative}
.hero textarea{
  background:rgba(245,182,44,.10);border:1px solid rgba(245,182,44,.32);color:#fff;
  border-radius:8px;padding:9px 11px;width:100%;outline:none;resize:vertical;font-size:13.5px;line-height:1.6;
}
.hero textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.hero .hlab{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,237,236,.45);margin:14px 0 5px;position:relative}
.hero .hstat{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;position:relative}
.hero .hstat div{min-width:74px}
.hero .hstat b{display:block;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .hstat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,237,236,.5);font-weight:700}

.w3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:980px){.w3{grid-template-columns:1fr}}
.wq{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wq>.wh{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.wq .wl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:0 0 auto}
.wq h3{margin:0;font-size:14px;font-weight:700}
.wq .wsub{font-size:10.5px;color:var(--ink3);margin-top:1px}
.wq .wb{padding:14px 16px}
.bul{margin:0;padding:0;list-style:none}
.bul li{display:flex;gap:8px;font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px dashed var(--line)}
.bul li:last-child{border-bottom:0}
.bul li .bx{color:var(--pink);font-weight:800;flex:0 0 auto}
.bul li textarea{flex:1}
.bul li .xbtn{flex:0 0 auto}

/* ---------- weights ---------- */
.wtrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.wtrow:last-child{border-bottom:0}
.wtrow .wtn{flex:1;font-size:12.5px}
.wtbar{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:0 0 auto}
.wtbar i{display:block;height:100%;background:var(--violet)}

/* ---------- raci ---------- */
.raci{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
@media(max-width:820px){.raci{grid-template-columns:1fr}}
.raci>div{padding:14px 16px}
.raci>div+div{border-left:1px solid var(--line)}
@media(max-width:820px){.raci>div+div{border-left:0;border-top:1px solid var(--line)}}
.raci h4{margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

@media print{
  #rail,#topbar,#pfoot{display:none}
  #app{grid-template-columns:1fr}
  #canvas{overflow:visible;padding:0}
  body{overflow:visible}
}
</style>
</head>
