<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAMSTARS ABM OS</title>
<style>
/* ============================================================
   ZAMSTARS ABM OS
   Single-file application. No external dependencies.
   Colour tokens come from content/brand.js in the ZAMSTARS Operating
   Playbook. Change them in :root only.
   ============================================================ */

:root{
  --ink:#30302F; --ink2:#4A4A48; --ink3:#6E6E6B;
  --pink:#CA366A; --violet:#5B3FA8; --gold:#F5B62C; --teal:#12A594;
  --paper:#F8F7F7; --line:#E4E3E3; --white:#fff;
  --pink-soft:rgba(202,54,106,.08); --violet-soft:rgba(91,63,168,.08);
  --gold-soft:rgba(245,182,44,.14); --teal-soft:rgba(18,165,148,.10);
  /* Two quiet washes so you can tell at a glance what is yours to fill in
     and what the app has worked out. Cream means type here. Pale green means
     this was calculated, so changing it means changing something upstream. */
  --in-bg:#FFFCF4; --in-line:#EDE1C7; --in-line2:#E2CFA4;
  --calc-bg:#F4FAF8; --calc-line:#D8EAE6; --calc-ink:#0E6B60;
  --rail:264px; --top:60px;
  --sh:0 1px 2px rgba(48,48,47,.06),0 4px 14px rgba(48,48,47,.05);
  --sh2:0 10px 40px rgba(48,48,47,.14);
  --r:10px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans); font-size:13.5px; line-height:1.55;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink)}
::selection{background:var(--gold-soft)}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(48,48,47,.18);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:rgba(48,48,47,.32)}

/* ============================================================ SHELL */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}

/* ---------- left rail ---------- */
#rail{
  background:var(--ink); color:#EDEDEC; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.brandbar{
  padding:16px 18px 14px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.star{width:19px;height:19px;color:var(--pink);flex:0 0 auto}
.star svg{width:100%;height:100%;display:block}
.brandbar .t1{font-weight:700;letter-spacing:.10em;font-size:11.5px}
.brandbar .t2{font-size:9.5px;letter-spacing:.16em;color:rgba(237,237,236,.5);margin-top:1px}

.railscroll{flex:1;overflow-y:auto;padding:12px 10px 20px}
.railgroup{margin-bottom:16px}
.railgroup h4{
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(237,237,236,.38); margin:0 0 7px 9px; font-weight:700;
}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;text-align:left;color:rgba(237,237,236,.76);
  padding:7px 9px;border-radius:8px;font-size:12.5px;line-height:1.3;
  transition:background .13s,color .13s; position:relative;
}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.on{background:var(--pink);color:#fff;font-weight:600}
.navitem.on .nx{background:rgba(255,255,255,.26);color:#fff;border-color:transparent}
.nx{
  flex:0 0 auto;width:19px;height:19px;border-radius:5px;
  display:grid;place-items:center;font-size:9.5px;font-weight:700;
  background:rgba(255,255,255,.07);color:rgba(237,237,236,.6);
  border:1px solid rgba(255,255,255,.09); font-family:var(--mono);
}
.navitem .nlab{flex:1;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.16)}
.dot.done{background:var(--teal)}
.dot.part{background:var(--gold)}

.railfoot{
  border-top:1px solid rgba(255,255,255,.09);padding:11px 12px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.railfoot button{
  flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:rgba(237,237,236,.85);border-radius:7px;padding:6px 4px;font-size:10.5px;font-weight:600;
  letter-spacing:.02em;transition:.13s;
}
.railfoot button:hover{background:rgba(255,255,255,.15);color:#fff}

.readiness{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09)}
.readiness .rlab{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,237,236,.4);font-weight:700}
.rbar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:7px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .5s cubic-bezier(.4,0,.2,1)}
.readiness .rnum{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.readiness .rnum small{font-size:10px;font-weight:500;color:rgba(237,237,236,.45)}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}

#topbar{
  height:var(--top);flex:0 0 auto;background:var(--white);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:10px;padding:0 18px;z-index:20;
}
.clientpick{
  display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:5px 8px 5px 6px;
}
.clogo{
  width:28px;height:28px;border-radius:7px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em;flex:0 0 auto;
}
.clientpick select{
  border:0;background:none;font-weight:650;font-size:13px;padding:0 2px;
  max-width:190px;outline:none;cursor:pointer;
}
.urlwrap{display:flex;align-items:center;gap:0;flex:1;max-width:420px}
.urlwrap input{
  flex:1;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;
  padding:7px 10px;background:var(--white);outline:none;font-size:12.5px;color:var(--ink2);
}
.urlwrap input:focus{border-color:var(--violet);box-shadow:-1px 0 0 var(--violet) inset}
.urlwrap button{
  border:1px solid var(--violet);background:var(--violet);color:#fff;
  border-radius:0 8px 8px 0;padding:7px 12px;font-size:11.5px;font-weight:650;white-space:nowrap;
}
.urlwrap button:hover{filter:brightness(1.12)}
.urlwrap button:disabled{opacity:.55;cursor:wait}
.beta{
  font-size:8.5px;font-weight:800;letter-spacing:.1em;background:var(--gold-soft);
  color:#8a6206;border:1px solid rgba(245,182,44,.5);border-radius:4px;padding:2px 4px;margin-left:6px;
}
.spacer{flex:1}
.tbtn{
  background:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:7px 11px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink3);color:var(--ink)}
.tbtn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn.pri:hover{background:#1e1e1d}
.tbtn.pk{background:var(--pink);border-color:var(--pink);color:#fff}
.tbtn.pk:hover{filter:brightness(1.1)}

#stagehead{
  flex:0 0 auto;background:var(--white);border-bottom:1px solid var(--line);
  padding:16px 26px 14px;
}
.shrow{display:flex;align-items:flex-start;gap:14px}
.shnum{
  width:34px;height:34px;border-radius:9px;background:var(--pink-soft);color:var(--pink);
  border:1px solid rgba(202,54,106,.22);display:grid;place-items:center;
  font-weight:800;font-size:13px;font-family:var(--mono);flex:0 0 auto;margin-top:1px;
}
#stagehead h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
#stagehead .sub{margin:4px 0 0;font-size:12.5px;color:var(--ink3);max-width:78ch;line-height:1.5}
.vgtag{
  display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-top:8px;
}
.vg-acq{background:var(--pink-soft);color:var(--pink)}
.vg-exp{background:var(--violet-soft);color:var(--violet)}
.vg-ret{background:var(--teal-soft);color:#0d7d70}
.vg-adv{background:var(--gold-soft);color:#8a6206}
.vg-all{background:rgba(48,48,47,.07);color:var(--ink2)}

#canvas{flex:1;overflow-y:auto;padding:22px 26px 90px;scroll-behavior:smooth}
.wrap{max-width:1240px}

/* ---------- cards & primitives ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>header h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.card>header .hint{font-size:11.5px;color:var(--ink3);font-weight:400}
.card .body{padding:16px}
.card .body.tight{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1180px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.f{margin-bottom:13px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.inp,textarea.inp,select.inp{
  width:100%;border:1px solid var(--in-line);border-radius:8px;padding:8px 10px;
  background:var(--in-bg);outline:none;transition:border-color .13s,box-shadow .13s;font-size:13px;
}
.inp:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 3px rgba(245,182,44,.16)}
.inp::placeholder,textarea.inp::placeholder{color:#B9A77E}
textarea.inp{resize:vertical;min-height:66px;line-height:1.55}
select.inp{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='%23997A3F' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px}
.hlp{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--paper);
  border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11.5px;color:var(--ink2);
}
.chip b{font-weight:650}
.chip button{background:none;border:0;color:var(--ink3);padding:0 0 0 1px;font-size:13px;line-height:1;opacity:.6}
.chip button:hover{opacity:1;color:var(--pink)}
.chip.add{border-style:dashed;cursor:pointer;color:var(--ink3)}
.chip.add:hover{border-color:var(--pink);color:var(--pink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.pk{background:var(--pink-soft);border-color:rgba(202,54,106,.3);color:var(--pink)}
.chip.vi{background:var(--violet-soft);border-color:rgba(91,63,168,.3);color:var(--violet)}
.chip.te{background:var(--teal-soft);border-color:rgba(18,165,148,.3);color:#0d7d70}
.chip.go{background:var(--gold-soft);border-color:rgba(245,182,44,.45);color:#8a6206}

.pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.t1p{background:var(--gold-soft);color:#8a6206;border:1px solid rgba(245,182,44,.5)}
.t2p{background:var(--violet-soft);color:var(--violet);border:1px solid rgba(91,63,168,.28)}
.t3p{background:rgba(48,48,47,.07);color:var(--ink2);border:1px solid var(--line)}
.okp{background:var(--teal-soft);color:#0d7d70;border:1px solid rgba(18,165,148,.3)}
.wrp{background:var(--gold-soft);color:#8a6206;border:1px solid rgba(245,182,44,.5)}
.bap{background:var(--pink-soft);color:var(--pink);border:1px solid rgba(202,54,106,.28)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:2;white-space:nowrap;
}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:rgba(202,54,106,.028)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.scrollx{overflow-x:auto}
/* a cell the app worked out, not one you type in */
td.calc{background:var(--calc-bg)}
.tbl tbody tr:hover td.calc{background:#EDF6F4}
.calcbox{background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:9px;padding:12px 14px}
.inbox{background:var(--in-bg);border:1px solid var(--in-line);border-radius:9px;padding:12px 14px}
.ce{
  border:1px solid transparent;border-radius:6px;padding:3px 5px;min-width:40px;
  background:var(--in-bg);outline:none;width:100%;font-size:12.5px;line-height:1.45;
}
.ce:hover{border-color:var(--in-line)}
.ce:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 3px rgba(245,182,44,.16)}
.ce::placeholder{color:#BCAB84}
td.ta .ce{white-space:pre-wrap;min-height:22px}
.mini{
  border:1px solid var(--in-line);border-radius:6px;padding:3px 5px;background:var(--in-bg);
  font-size:11.5px;outline:none;max-width:100%;
}
.mini:focus{border-color:var(--in-line2);background:#fff;box-shadow:0 0 0 2px rgba(245,182,44,.16)}
.xbtn{background:none;border:0;color:var(--ink3);opacity:.45;font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
.xbtn:hover{opacity:1;color:var(--pink);background:var(--pink-soft)}
.addrow{
  width:100%;background:var(--paper);border:0;border-top:1px dashed var(--line);
  padding:9px;font-size:12px;font-weight:650;color:var(--ink3);border-radius:0 0 var(--r) var(--r);
}
.addrow:hover{background:var(--pink-soft);color:var(--pink)}

/* ---------- metric tiles ---------- */
.tile{background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.tile .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.tile .v{font-size:25px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.1}
.tile .d{font-size:11px;color:var(--ink3);margin-top:2px}
.tile.pk{border-left:3px solid var(--pink)}
.tile.vi{border-left:3px solid var(--violet)}
.tile.te{border-left:3px solid var(--teal)}
.tile.go{border-left:3px solid var(--gold)}

/* ---------- journey ---------- */
.jflow{display:flex;gap:0;overflow-x:auto;padding:4px 0 12px}
.jnode{
  flex:0 0 auto;min-width:132px;max-width:170px;background:var(--white);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;position:relative;
  margin-right:16px;box-shadow:var(--sh);cursor:pointer;transition:.14s;
}
.jnode:last-child{margin-right:0}
.jnode:after{
  content:'';position:absolute;right:-16px;top:50%;width:16px;height:1.5px;
  background:var(--line);
}
.jnode:last-child:after{display:none}
.jnode:hover{border-color:var(--pink);transform:translateY(-1px)}
.jnode.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft),var(--sh)}
.jnode .jn{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--ink3);font-family:var(--mono)}
.jnode .jt{font-size:12px;font-weight:680;line-height:1.3;margin-top:3px}
.jnode .jm{font-size:10.5px;color:var(--ink3);margin-top:4px;line-height:1.35}
.jnode .jvg{position:absolute;top:0;left:11px;right:11px;height:2.5px;border-radius:0 0 3px 3px}

.lens{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lens .lab{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* ---------- signoff bar ---------- */
.signoff{
  background:linear-gradient(180deg,#fff,var(--paper));border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:16px;
}
.signoff .sohead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.signoff .sohead b{font-size:12.5px}
.soflag{
  width:22px;height:22px;border-radius:6px;background:var(--pink-soft);color:var(--pink);
  display:grid;place-items:center;font-size:12px;flex:0 0 auto;
}
.sorow{display:flex;gap:10px;align-items:flex-start}
.sorow textarea{flex:1}
.toggle{
  display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;font-size:12px;font-weight:650;color:var(--ink3);white-space:nowrap;
  align-self:stretch;
}
.toggle:hover{border-color:var(--teal);color:#0d7d70}
.toggle.on{background:var(--teal);border-color:var(--teal);color:#fff}
.toggle .tk{
  width:15px;height:15px;border-radius:4px;border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:10px;flex:0 0 auto;
}
.toggle.on .tk{background:#fff;color:var(--teal);border-color:#fff}

/* ---------- the two-colour key ---------- */
.keylegend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto;padding-top:3px}
.kl{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;
  color:var(--ink3);border-radius:20px;padding:3px 10px 3px 7px;white-space:nowrap;
}
.kl i{width:10px;height:10px;border-radius:3px;display:block;flex:0 0 auto}
.kl-in{background:var(--in-bg);border:1px solid var(--in-line)}
.kl-in i{background:#fff;border:1px solid var(--in-line2)}
.kl-calc{background:var(--calc-bg);border:1px solid var(--calc-line)}
.kl-calc i{background:#CFE7E2;border:1px solid var(--calc-line)}

/* ---------- callout ---------- */
.co{border-left:3px solid var(--violet);background:var(--violet-soft);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.co b{font-weight:700}
.co.pk{border-color:var(--pink);background:var(--pink-soft)}
.co.go{border-color:var(--gold);background:var(--gold-soft)}
.co.te{border-color:var(--teal);background:var(--teal-soft)}
.co .cot{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.8}

/* ---------- score bars ---------- */
.sb{display:flex;align-items:center;gap:7px;min-width:96px}
.sb .track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.sb .track i{display:block;height:100%;border-radius:3px;transition:width .3s}
.sb .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;width:20px;text-align:right;color:var(--ink2)}
.rng{width:74px;accent-color:var(--pink);cursor:pointer;vertical-align:middle}

/* ---------- heatmap ---------- */
.hm{border-collapse:separate;border-spacing:3px;font-size:11px}
.hm th{background:transparent;border:0;padding:3px 6px;font-size:9px;position:static}
.hm td{border:0;padding:0}
.hmc{
  width:100%;min-width:52px;height:34px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);
}

/* ---------- funnel ---------- */
.fun{display:flex;flex-direction:column;gap:4px}
.funrow{display:flex;align-items:center;gap:10px}
.funrow .fl{width:150px;font-size:11.5px;color:var(--ink2);text-align:right;flex:0 0 auto;line-height:1.25}
.funrow .fbar{flex:1;height:26px;background:var(--paper);border-radius:5px;overflow:hidden;position:relative}
.funrow .fbar i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.funrow .fbar span{position:absolute;left:8px;top:0;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;font-family:var(--mono);color:var(--ink)}
.funrow .fn{width:34px;font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink3);flex:0 0 auto}

/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:rgba(48,48,47,.42);display:none;z-index:200;backdrop-filter:blur(2px)}
#mask.on{display:grid;place-items:center;padding:24px}
.modal{background:var(--white);border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:600px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:15px;font-weight:700}
.modal .mb{padding:20px;overflow-y:auto;flex:1}
.modal footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--paper)}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;font-weight:600;
  box-shadow:var(--sh2);z-index:300;transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:min(520px,90vw);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- presenter footer ---------- */
#pfoot{
  position:fixed;bottom:0;left:var(--rail);right:0;height:0;overflow:hidden;
  background:var(--ink);color:#EDEDEC;transition:height .25s;z-index:30;
}
#pfoot.on{height:auto;min-height:52px;padding:12px 26px 13px}
#pfoot .pt{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
#pfoot .pc{font-size:12.5px;line-height:1.5;max-width:120ch;color:rgba(237,237,236,.9)}
#pfoot .px{position:absolute;top:10px;right:20px;background:none;border:0;color:rgba(237,237,236,.5);font-size:16px}
#pfoot .px:hover{color:#fff}

/* ---------- misc ---------- */
.muted{color:var(--ink3)}
.tiny{font-size:11px}
.mono{font-family:var(--mono)}
.rowend{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:32px 20px;text-align:center;color:var(--ink3);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.kv dd{margin:0}
.bignum{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.persona{border:1px solid var(--line);border-radius:9px;padding:13px;background:var(--white);position:relative}
.persona .ph{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.pav{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:0 0 auto}
.persona h4{margin:0;font-size:13px;font-weight:700;line-height:1.25}
.persona .prole{font-size:10.5px;color:var(--ink3);margin-top:1px}
.pfield{margin-bottom:8px}
.pfield .pl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.play{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--white);transition:.14s;position:relative}
.play.off{opacity:.5;background:var(--paper)}
.play .phd{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px}
.play h4{margin:0;font-size:12.5px;font-weight:680;line-height:1.3;flex:1}
.play .pd{font-size:11.5px;color:var(--ink3);line-height:1.45}
.play .pm{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.sw{width:34px;height:19px;border-radius:11px;background:var(--line);position:relative;border:0;flex:0 0 auto;transition:.16s}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--teal)}
.sw.on:after{left:17px}
.wkcol{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.ph1{border-color:var(--pink)}.ph2{border-color:var(--violet)}.ph3{border-color:var(--teal)}
.pjump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pjump button{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:650;color:var(--ink3)}
.pjump button:hover,.pjump button.on{border-color:var(--pink);color:var(--pink);background:var(--pink-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2.5px;margin-right:4px;vertical-align:-1px}
/* ---------- executive summary ---------- */
.hero{
  background:var(--ink);color:#EDEDEC;border-radius:14px;padding:0;margin-bottom:22px;
  position:relative;overflow:hidden;
  box-shadow:0 18px 50px rgba(48,48,47,.20);
}
.hero:after{content:'';position:absolute;top:-90px;right:-60px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(202,54,106,.34),transparent 68%);pointer-events:none}
.herogrid{display:grid;grid-template-columns:1.4fr .85fr;gap:0;position:relative;z-index:1}
@media(max-width:1080px){.herogrid{grid-template-columns:1fr}}
.heroL{padding:28px 30px 26px}
.heroR{
  padding:28px 30px 26px;border-left:1px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;
}
@media(max-width:1080px){.heroR{border-left:0;border-top:1px solid rgba(255,255,255,.09)}}

/* client lockup */
.lockup{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lockup .cmark{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:6px 11px 6px 8px;
}
.lockup .cmark img{height:19px;width:auto;display:block;filter:brightness(0) invert(1)}
.lockup .cmark b{font-size:14px;font-weight:750;letter-spacing:-.01em}
.lockup .xsep{color:rgba(237,237,236,.32);font-size:13px}
.lockup .zmark{display:flex;align-items:center;gap:6px;color:rgba(237,237,236,.72)}
.lockup .zmark .star{width:13px;height:13px;color:var(--pink)}
.lockup .zmark span{font-size:10.5px;font-weight:800;letter-spacing:.13em}

.hero .hk{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:9px}
.hero .hmeta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:11.5px;color:rgba(237,237,236,.6)}
.hero .hmeta b{color:rgba(237,237,236,.9);font-weight:650}
.editbtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:rgba(237,237,236,.7);
  border-radius:7px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;margin-top:14px;
}
.editbtn:hover{background:rgba(255,255,255,.15);color:#fff}

/* the estate: one tile per building, and the dim ones are dead zones */
.estatewrap{position:relative}
.estate{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:250px}
.estate i{
  display:block;aspect-ratio:1/1;border-radius:2.5px;background:rgba(18,165,148,.72);
  animation:lit .9s ease-out backwards;
}
.estate i.dim{background:rgba(255,255,255,.10)}
.estate i.dead{background:rgba(202,54,106,.85);animation:pulse 2.8s ease-in-out infinite}
@keyframes lit{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.estatelegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:10.5px;color:rgba(237,237,236,.6)}
.estatelegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hero .opchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.hero .opchips span{
  font-size:9.5px;font-weight:750;letter-spacing:.06em;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:3px 7px;color:rgba(237,237,236,.75);
}

/* proof strip */
.proofstrip{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;box-shadow:var(--sh);margin-bottom:22px;
}
.proofstrip .pslab{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.proofstrip .pl{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--paper);
}
.proofstrip .pl img{height:14px;width:auto;display:block;opacity:.8}
.proofstrip .pl .dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}

/* stat card system */
.scards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
@media(max-width:1080px){.scards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.scards{grid-template-columns:1fr}}
.sc{
  background:var(--calc-bg);border:1px solid var(--calc-line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;
}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(48,48,47,.10)}
.sc.wide{grid-column:span 2}
@media(max-width:680px){.sc.wide{grid-column:span 1}}
.sc .sck{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sc .scv{font-size:30px;font-weight:750;letter-spacing:-.035em;line-height:1.05;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.sc .scv small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}
.sc .scd{font-size:11px;color:var(--ink3);line-height:1.45}
.sc .scicon{position:absolute;top:13px;right:14px;font-size:15px;opacity:.20}
.sc.ring{display:flex;align-items:center;gap:14px}
.sc.ring .rtxt{flex:1;min-width:0}
.sc .tierbar{display:flex;gap:3px;margin-top:7px;height:6px}
.sc .tierbar i{display:block;border-radius:2px}
.sc .segdots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.sc .segdots i{width:7px;height:7px;border-radius:50%;display:block}

/* section divider, which is really just the breathing room */
.divider{display:flex;align-items:center;gap:14px;margin:34px 0 18px}
.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}
.divider span{
  font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;
}
.divider.tight{margin:26px 0 16px}
/* The thesis is the first thing said out loud in the room, so let it run the
   full width of the canvas rather than wrapping into a narrow column. */
.hero h2{
  margin:10px 0 0; font-weight:700; letter-spacing:-.022em;
  font-size:clamp(19px,1.95vw,28px); line-height:1.32;
  max-width:none; padding-right:64px; position:relative; text-wrap:pretty;
}
@media(max-width:900px){ .hero h2{padding-right:0} }
.hero .hs{margin-top:11px;font-size:13.5px;line-height:1.6;color:rgba(237,237,236,.82);max-width:82ch;position:relative}
.hero textarea{
  background:rgba(245,182,44,.10);border:1px solid rgba(245,182,44,.32);color:#fff;
  border-radius:8px;padding:9px 11px;width:100%;outline:none;resize:vertical;font-size:13.5px;line-height:1.6;
}
.hero textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.hero .hlab{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,237,236,.45);margin:14px 0 5px;position:relative}
.hero .hstat{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;position:relative}
.hero .hstat div{min-width:74px}
.hero .hstat b{display:block;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .hstat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,237,236,.5);font-weight:700}

.w3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:980px){.w3{grid-template-columns:1fr}}
.wq{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wq>.wh{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.wq .wl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:0 0 auto}
.wq h3{margin:0;font-size:14px;font-weight:700}
.wq .wsub{font-size:10.5px;color:var(--ink3);margin-top:1px}
.wq .wb{padding:14px 16px}
.bul{margin:0;padding:0;list-style:none}
.bul li{display:flex;gap:8px;font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px dashed var(--line)}
.bul li:last-child{border-bottom:0}
.bul li .bx{color:var(--pink);font-weight:800;flex:0 0 auto}
.bul li textarea{flex:1}
.bul li .xbtn{flex:0 0 auto}

/* ---------- weights ---------- */
.wtrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.wtrow:last-child{border-bottom:0}
.wtrow .wtn{flex:1;font-size:12.5px}
.wtbar{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:0 0 auto}
.wtbar i{display:block;height:100%;background:var(--violet)}

/* ---------- raci ---------- */
.raci{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
@media(max-width:820px){.raci{grid-template-columns:1fr}}
.raci>div{padding:14px 16px}
.raci>div+div{border-left:1px solid var(--line)}
@media(max-width:820px){.raci>div+div{border-left:0;border-top:1px solid var(--line)}}
.raci h4{margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

@media print{
  #rail,#topbar,#pfoot{display:none}
  #app{grid-template-columns:1fr}
  #canvas{overflow:visible;padding:0}
  body{overflow:visible}
}
</style>

<body>
<div id="app">

  <!-- ==================== LEFT RAIL ==================== -->
  <aside id="rail">

      <div>
        <div class="t1">ZAMSTARS</div>

      </div>

    <div class="railscroll">
      <div class="railgroup">
        <h4>Programme Build</h4>

    <div class="railfoot">
      <button id="btn-present" title="Toggle presenter notes">Presenter</button>
      <button id="btn-export" title="Download this programme as JSON">Export</button>
      <button id="btn-import" title="Load a programme JSON">Import</button>

  </aside>

  <!-- ==================== MAIN ==================== -->
  <div id="main">

    <div id="topbar">
      <div class="clientpick">
        <span class="clogo" id="clogo">iB</span>

      </div>

      <div class="urlwrap">
        <input id="clienturl" placeholder="https://client-website.com" spellcheck="false">
        <button id="btn-analyse">Analyse business</button>
      </div>
      <span class="beta">BETA</span>

      <div class="spacer"></div>

<div id="mask"><div class="modal" id="modal"></div></div>

<input type="file" id="filein" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ============================================================
   0. BRAND + FRAMEWORK CONSTANTS
   ============================================================ */
const STAR = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M42 4h16v27l19-19 11 11-19 19h27v16H69l19 19-11 11-19-19v27H42V69L23 88 12 77l19-19H4V42h27L12 23l11-11 19 19V4z"/></svg>';

const C = { pink:'#CA366A', violet:'#5B3FA8', gold:'#F5B62C', teal:'#12A594', ink:'#30302F', ink3:'#6E6E6B' };

/* The ZAMSTARS Value Grid. Every stage sits on one band of it. */
const VG = {
  acq: { key:'acq', label:'Acquisition', cls:'vg-acq', colour:C.pink },
  exp: { key:'exp', label:'Experience', cls:'vg-exp', colour:C.violet },
  ret: { key:'ret', label:'Retention', cls:'vg-ret', colour:C.teal },
  adv: { key:'adv', label:'Advocacy',  cls:'vg-adv', colour:C.gold },
  all: { key:'all', label:'Full Value Grid', cls:'vg-all', colour:C.ink3 }
};

/* ------------------------------------------------------------
   How accounts get scored. Seven things we rate out of ten,
   weighted into a mark out of a hundred. The weights belong to
   the client, so they are editable.
   ------------------------------------------------------------ */
const SCORE_FACTORS = [
  { k:'pot',   label:'Revenue potential',    w:25, hint:'What the whole account is worth if we win all of it.' },
  { k:'fit',   label:'Portfolio fit',        w:20, hint:'Size, density, number of sites, whether they need more than one operator.' },
  { k:'trig',  label:'Live trigger',         w:20, hint:'Is something happening right now that gives us a reason to call this week?' },
  { k:'geo',   label:'Can we deliver',       w:10, hint:'Can we actually serve them, at this standard, today?' },
  { k:'brand', label:'Reference value',      w:10, hint:'What winning this does for every other conversation in the segment.' },
  { k:'rel',   label:'Warm door',            w:10, hint:'A prior contract, a group relationship, someone who can make an introduction.' },
  { k:'eng',   label:'Signs of interest',    w:5,  hint:'Things we have actually seen them do: visits, downloads, replies, turning up.' }
];
const TIER_BANDS = { t1:74, t2:52 };

/* ------------------------------------------------------------
   The six people who show up on an enterprise decision. Titles
   change from company to company. These six roles do not.
   ------------------------------------------------------------ */
const COMMERCIAL_ROLES = [
  ['econ',  'Holds the budget',    'Return, risk, whether this scales, what the deal looks like',   'A business case with their own portfolio numbers in it', C.pink],
  ['tech',  'Judges the design',   'Architecture, security, performance, how it fits what they run', 'An architecture note and a working session with our engineers', C.violet],
  ['ops',   'Lives with it daily', 'Uptime, maintenance, how much disruption it causes them',        'The SLA, how monitoring works, a case study from someone like them', C.teal],
  ['proj',  'Controls the timeline','Dates, drawings, coordination with everyone else on site',      'A rollout plan and a checklist they can hand to their contractor', '#8A6206'],
  ['proc',  'Signs the contract',  'Price, terms, whether we will still exist in year seven',       'Total cost of ownership, our credentials, answers to the awkward questions', C.ink],
  ['champ', 'Sells it internally', 'Getting colleagues on side and getting it approved',            'A deck they can present as their own, plus an email they can forward', '#0d7d70']
];
const ROLE_LBL = {}; const ROLE_COL = {};
COMMERCIAL_ROLES.forEach(r=>{ ROLE_LBL[r[0]]=r[1]; ROLE_COL[r[0]]=r[4]; });

/* ------------------------------------------------------------
   Four layers of measurement, in order. Lead-generation numbers
   applied to ABM will tell you a confident lie.
   ------------------------------------------------------------ */
const LAYERS = {
  cov:  { key:'cov',  label:'Coverage',    q:'Do we even know who we are selling to?',            colour:C.ink3,   vg:'acq' },

/* ---------- the weighted account score ----------
   Has to survive being called during hydration, when the client is not in
   the store yet, so it falls back to the default weights. */
const DEFAULT_W = {}; SCORE_FACTORS.forEach(f=>DEFAULT_W[f.k]=f.w);
function weights(){
  const c = (typeof S!=='undefined' && S.clients) ? S.clients[S.current] : null;
  if(!c) return DEFAULT_W;
  if(!c.weights){ c.weights={}; SCORE_FACTORS.forEach(f=>c.weights[f.k]=f.w); }
  return c.weights;
}
function wSum(w){ let s=0; SCORE_FACTORS.forEach(f=>s+=num(w[f.k])); return s||100; }
function weightSum(){ return wSum(weights()); }
function scoreOf(a, wIn){
  const w = wIn || weights(), tot = wSum(w);
  let s=0; SCORE_FACTORS.forEach(f=>{ s += clamp(num(a[f.k]),0,10) * num(w[f.k]); });
  /* normalise to 0-100 whatever the weights add up to, then round to 1dp so a
     float artefact can never flip a tier boundary */
  return Math.round((s / tot) * 100)/10;
}
function tierOf(a, wIn){
  const s = scoreOf(a, wIn);
  return s>=TIER_BANDS.t1 ? 't1' : s>=TIER_BANDS.t2 ? 't2' : 't3';
}
const TIERLBL   = { t1:'Tier 1 · 1:1', t2:'Tier 2 · 1:Few', t3:'Tier 3 · 1:Many' };
const TIERPILL  = { t1:'t1p', t2:'t2p', t3:'t3p' };
const TIERSHORT = { t1:'T1', t2:'T2', t3:'T3' };
const TIERS = ['t1','t2','t3'];

/* ---------- budget allocation ----------
   The client gives one number. We split it across the tiers, with Tier 1
   getting the most because Tier 1 is where the evidence is, then across the
   live plays in each tier by effort weight.
   Type a number over a play and it becomes FIXED, so the rest of that tier
   redistributes around it. Switch a play off and its money goes back into
   the pool instead of being stranded. */
const TIER_SPLIT_DEFAULT = { t1:50, t2:32, t3:18 };

function tierSplit(c){
  c = c || cur();
  if(!c.tierSplit) c.tierSplit = Object.assign({}, TIER_SPLIT_DEFAULT);
  return c.tierSplit;
}
function splitSum(c){ const s = tierSplit(c); let n=0; TIERS.forEach(k=>n+=num(s[k])); return n||100; }
function tierTarget(k, c){
  c = c || cur();
  return Math.round(num(c.objective.budget) * num(tierSplit(c)[k]) / splitSum(c));
}
function tierActual(k, c){
  c = c || cur();
  let n=0; c.plays.forEach(p=>{ if(p.tier===k && p.on) n+=num(p.budget); }); return n;
}
function tierLocked(k, c){
  c = c || cur();
  let n=0; c.plays.forEach(p=>{ if(p.tier===k && p.on && p.lock) n+=num(p.budget); }); return n;
}
/* returns a per-tier report so the UI can explain itself */
function allocateBudget(c){
  c = c || cur();
  const report = {};
  TIERS.forEach(k=>{
    const target = tierTarget(k, c);
    const live   = c.plays.filter(p=>p.tier===k && p.on);
    const fixed  = live.filter(p=>p.lock);
    const auto   = live.filter(p=>!p.lock);
    let lockedSum = 0; fixed.forEach(p=>lockedSum+=num(p.budget));
    const remaining = target - lockedSum;
    report[k] = { target:target, live:live.length, fixed:fixed.length, auto:auto.length,
                  lockedSum:lockedSum, over: remaining<0 };
    if(!auto.length) return;
    const pool = Math.max(0, remaining);
    let ws = 0; auto.forEach(p=>ws+=num(p.weight));
    if(!ws){ auto.forEach(p=>p.weight=1); ws = auto.length; }
    let given = 0;
    auto.forEach(p=>{ p.budget = Math.round(pool * num(p.weight) / ws); given += p.budget; });
    /* the rounding remainder goes on the heaviest auto play, so tier totals come out exact */
    const diff = pool - given;
    if(diff){
      const big = auto.slice().sort((a,b)=>num(b.weight)-num(a.weight))[0];
      big.budget = Math.max(0, num(big.budget) + diff);
    }
  });
  c._alloc = report;
  return report;
}

function baseline(){

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ clients:S.clients, order:S.order, current:S.current, stage:S.stage })); }
  catch(e){ /* file:// or private mode. The session still works, it just will not persist. */ }

function normalise(c){
  ['accounts','signals','journey','plays','roadmap','kpis','segments','personas','umbrellas','hooks','assets','sla','deps','successMetrics','icpFit','disqualify'].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=[]; });
  if(!c.exec_) c.exec_={entries:[]};
  if(!c.exec) c.exec={why:[],how:[]};
  if(!Array.isArray(c.exec.why)) c.exec.why=[];
  if(!Array.isArray(c.exec.how)) c.exec.how=[];
  if(!c.signoff) c.signoff={};
  if(!c.clientNotes) c.clientNotes={};
  if(!c.lens) c.lens={};
  if(!c.weights){ c.weights={}; SCORE_FACTORS.forEach(f=>c.weights[f.k]=f.w); }
  if(!c.tierSplit) c.tierSplit = Object.assign({}, TIER_SPLIT_DEFAULT);
  c.accounts.forEach(a=>{ if(!Array.isArray(a.roles)) a.roles=[]; if(a.touches==null) a.touches=num(a.engaged); });
  c.kpis.forEach(k=>{ if(k.current==null) k.current=''; if(!k.layer) k.layer='eng'; });
  /* Programmes saved before the allocator existed had frozen play budgets that
     stranded the share of any switched-off play, so their totals will not add up
     until we redistribute once. */
  const legacyPlays = c.plays.some(p=>p.lock===undefined);
  c.plays.forEach(p=>{ if(p.lock==null) p.lock=false; if(p.budget==null) p.budget=0; });
  if(legacyPlays && c.plays.length) allocateBudget(c);
}
function load(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw){ baseline(); return false; }
  try{
    const d = JSON.parse(raw);
    if(!d.clients || !d.order || !d.order.length) throw 0;
    S.clients=d.clients; S.order=d.order;
    S.current = d.clients[d.current] ? d.current : d.order[0];
    S.stage = STAGE_IX[d.stage]!=null ? d.stage : 'exec';

/* ============================================================
   6. PATH BINDING
   One dot-path syntax for everything:
     "profile.whatTheyDo"      object field
     "accounts.a-1x2y.pot"     array member looked up by id
     "journey.3.name"          array member by index
     "hooks"                   an array itself
   data-live="1" re-renders the stage after the change.
   ============================================================ */
function walk(node, key){
  if(node==null) return undefined;
  if(Array.isArray(node)) return /^\d+$/.test(key) ? node[+key] : node.filter(x=>x&&x.id===key)[0];
  return node[key];
}
function resolvePath(path){
  const p = String(path).split('.');
  let o = cur();
  for(let i=0;i<p.length-1;i++){ o = walk(o,p[i]); if(o==null) return null; }
  return { obj:o, key:p[p.length-1] };
}
function getPath(path){
  const r = resolvePath(path); if(!r) return '';
  let v;
  if(Array.isArray(r.obj)) v = /^\d+$/.test(r.key) ? r.obj[+r.key] : (r.obj.filter(x=>x&&x.id===r.key)[0]);
  else v = r.obj[r.key];
  return v==null?'':v;
}
function setPath(path, val){
  const r = resolvePath(path); if(!r||r.obj==null) return;
  if(Array.isArray(r.obj) && /^\d+$/.test(r.key)) r.obj[+r.key] = val;
  else r.obj[r.key] = val;
}
function arrPath(path){
  const r = resolvePath(path); if(!r||r.obj==null) return [];
  let v;
  if(Array.isArray(r.obj) && /^\d+$/.test(r.key)) v = r.obj[+r.key];
  else v = r.obj[r.key];
  if(!Array.isArray(v)){ if(Array.isArray(r.obj) && r.key===undefined) return r.obj; v=[]; if(!Array.isArray(r.obj)||!/^\d+$/.test(r.key)) r.obj[r.key]=v; }
  return v;
}

/* the coloured left edge of a stat card, inline so nothing leaks between grids */
function edge(colour){ return 'box-shadow:inset 3px 0 0 '+colour+', var(--sh)'; }

/* a donut, drawn inline so it needs nothing external */
function ring(v, colour, size){
  size = size||62;
  const r = size/2 - 5, cx = size/2, circ = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex:0 0 auto">'+
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+mix(colour,.16)+'" stroke-width="6"/>'+
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+colour+'" stroke-width="6" stroke-linecap="round"'+
      ' stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+(circ*(1-clamp(v,0,100)/100)).toFixed(1)+'"'+
      ' transform="rotate(-90 '+cx+' '+cx+')"/>'+
    '<text x="'+cx+'" y="'+(cx+4.5)+'" text-anchor="middle" font-size="14.5" font-weight="750" fill="'+C.ink+'">'+Math.round(v)+'</text>'+
    '</svg>';
}

/* The estate: one tile per building. Lit = covered, magenta = a dead zone.
   Deliberately abstract. It is the client's problem drawn as data rather than clip art,
   and it renders identically with no network. */
function estate(){
  const cols=12, rows=6, n=cols*rows;
  const dead = [14,27,41,52,58];
  const dim  = [3,9,20,33,38,47,55,63,66,70];
  let out='';
  for(let i=0;i<n;i++){
    const cls = dead.indexOf(i)>-1 ? ' dead' : dim.indexOf(i)>-1 ? ' dim' : '';
    const d = ((i%cols)*0.035 + Math.floor(i/cols)*0.06).toFixed(3);
    out += '<i class="'+cls.trim()+'" style="animation-delay:'+d+'s"></i>';
  }
  return '<div class="estatewrap"><div class="estate">'+out+'</div>'+
    '<div class="estatelegend">'+
      '<span><i style="background:rgba(18,165,148,.72)"></i>Covered</span>'+
      '<span><i style="background:rgba(255,255,255,.10)"></i>Unaddressed</span>'+
      '<span><i style="background:rgba(202,54,106,.85)"></i>Dead zone</span>'+
    '</div></div>';
}

/* map a success measure to a live number where we can compute one */
function smLive(metric){
  const m = String(metric).toLowerCase(), e = execTotals(), cv = coverage();
  if(m.indexOf('accounts that engage')>-1) return e.touched+' of '+e.total;
  if(m.indexOf('people reached per account')>-1) return cv.pThreePct+'% at 3+ roles';
  if(m.indexOf('real conversations')>-1) return e.meetings;
  if(m.indexOf('health checks')>-1) return latestReading('health checks accepted');
  if(m.indexOf('opportunities')>-1) return liveAccounts().filter(a=>num(a.stage)>=5).length;
  if(m.indexOf('reporting')>-1) return cur().exec_.entries.length? 'running' : null;
  return null;
}

const LENSF = ['thinks','does','question'];
function lensGet(pid, idx, field){
  const L=cur().lens||{}; const row = L[pid] && L[pid][idx];
  if(!row) return null;
  const v = row[LENSF.indexOf(field)];
  return v==null?null:v;
}
function lensSet(pid, idx, field, val){
  const c=cur(); c.lens=c.lens||{}; c.lens[pid]=c.lens[pid]||{};
  const row = c.lens[pid][idx] || [null,null,null];
  row[LENSF.indexOf(field)] = val;
  c.lens[pid][idx]=row;
}
function lensCell(pid, idx, field, base){
  const has = lensGet(pid,idx,field);
  const v = has==null ? base : has;
  const style = (has==null) ? ' style="color:var(--ink3);font-style:italic"' : '';
  return '<textarea class="ce" data-lens="'+pid+'|'+idx+'|'+field+'" rows="2"'+style+'>'+esc(v)+'</textarea>';
}

function vJourney(){
  const c = cur();
  const lens = S.lensPersona;
  const sel = clamp(S.jSel,0,Math.max(0,c.journey.length-1));

  if(!c.journey.length){
    return signoffBlock()+'<div class="card"><div class="empty">No journey yet. '+
      '<button class="tbtn pk" data-act="jgen" style="margin-left:8px">Generate one from the '+esc((ARCHETYPES[c.archetype]||{}).label||'')+' archetype</button></div></div>';
  }
  const st = c.journey[sel];

  const flow = '<div class="jflow">'+c.journey.map(function(j,i){
    const vg = VG[j.vg]||VG.all, q = String(j.question||'');
    return '<div class="jnode'+(i===sel?' on':'')+'" data-act="jsel" data-i="'+i+'">'+
      '<div class="jvg" style="background:'+vg.colour+'"></div>'+
      '<div class="jn">'+String(i+1).padStart(2,'0')+' · '+vg.label.toUpperCase().slice(0,3)+'</div>'+
      '<div class="jt">'+j.name+'</div>'+
      '<div class="jm">'+esc(q.slice(0,58))+(q.length>58?'…':'')+'</div></div>';
  }).join('')+'</div>';

  const lensBar = '<div class="lens"><span class="lab">Persona lens</span>'+
    '<span class="chip '+(lens==='all'?'sel':'')+'" data-act="lens" data-v="all" style="cursor:pointer">All personas</span>'+
    c.personas.map(function(p){
      const filled = (c.lens && c.lens[p.id]) ? Object.keys(c.lens[p.id]).length : 0;
      return '<span class="chip '+(lens===p.id?'sel':'')+'" data-act="lens" data-v="'+p.id+'" style="cursor:pointer">'+p.role+
        (filled?' <b style="opacity:.65">'+filled+'/'+c.journey.length+'</b>':' <b style="opacity:.5">draft</b>')+'</span>';
    }).join('')+
    '<span class="muted tiny" style="margin-left:auto">'+(lens==='all'
      ? 'Showing the baseline journey. Pick a persona to see the same journey through their eyes.'
      : 'The italic grey cells are carried over from the baseline. Type over one and it becomes this person’s own.')+'</span></div>';

  const vgOpts = [['acq','Acquisition'],['exp','Experience'],['ret','Retention'],['adv','Advocacy']];

  const table = '<div class="card"><header><h3>Journey grid</h3>'+
    '<span class="hint">every cell is editable · rows reorder · stages add and delete</span>'+
    '<span style="flex:1"></span><span class="muted tiny">'+c.journey.length+' stages</span></header>'+
    '<div class="body tight scrollx"><table class="tbl"><thead><tr>'+
      '<th style="width:30px">#</th><th style="min-width:130px">Stage</th><th style="width:96px">Value Grid</th>'+
      '<th style="min-width:200px">What they think</th><th style="min-width:190px">What they do</th>'+
      '<th style="min-width:180px">The question in their head</th>'+
      '<th style="min-width:145px">Channels</th><th style="min-width:145px">Assets that do the work</th>'+
      '<th style="min-width:150px">Proof metric</th><th style="min-width:95px">Owner</th>'+
      '<th style="min-width:185px">Where it stalls</th><th style="width:66px"></th>'+
    '</tr></thead><tbody>'+
    c.journey.map(function(j,i){
      const hl = (i===sel) ? ' style="background:'+mix(C.pink,.045)+'"' : '';
      return '<tr'+hl+'>'+
        '<td class="num" style="color:var(--ink3)">'+(i+1)+'</td>'+
        '<td><input class="ce" data-set="journey.'+i+'.name" value="'+esc(j.name)+'" style="font-weight:650"></td>'+
        '<td>'+tsel('journey.'+i+'.vg', vgOpts, true)+'</td>'+
        '<td class="ta">'+(lens==='all' ? ta('journey.'+i+'.thinks','','ce') : lensCell(lens,i,'thinks', j.thinks))+'</td>'+
        '<td class="ta">'+(lens==='all' ? ta('journey.'+i+'.does','','ce')   : lensCell(lens,i,'does',   j.does))+'</td>'+
        '<td class="ta">'+(lens==='all' ? ta('journey.'+i+'.question','','ce'): lensCell(lens,i,'question', j.question))+'</td>'+
        '<td>'+chipsOf('journey.'+i+'.channels','vi')+'</td>'+
        '<td>'+chipsOf('journey.'+i+'.assets','pk')+'</td>'+
        '<td class="ta">'+ta('journey.'+i+'.kpi','','ce')+'</td>'+
        '<td>'+ti('journey.'+i+'.owner','','ce')+'</td>'+
        '<td class="ta">'+ta('journey.'+i+'.friction','','ce')+'</td>'+
        '<td style="white-space:nowrap">'+
          '<button class="xbtn" data-act="jup" data-i="'+i+'" title="Move earlier">&uarr;</button>'+
          '<button class="xbtn" data-act="jdn" data-i="'+i+'" title="Move later">&darr;</button>'+
          '<button class="xbtn" data-act="jdel" data-i="'+i+'" title="Delete stage">&times;</button>'+
        '</td></tr>';
    }).join('')+
    '</tbody></table></div><button class="addrow" data-act="jadd">+ Add a journey stage</button></div>';

  const vg = VG[st.vg]||VG.all;
  const detail = '<div class="card" style="border-left:3px solid '+vg.colour+'">'+
    '<header><span class="pill" style="background:'+mix(vg.colour,.12)+';color:'+vg.colour+';border:1px solid '+mix(vg.colour,.3)+'">STAGE '+(sel+1)+' · '+vg.label.toUpperCase()+'</span>'+
      '<h3 style="flex:1">'+st.name+'</h3></header>'+
    '<div class="body"><div class="grid2">'+
      '<div>'+
        '<div class="f"><label>Buyer mindset</label>'+ta('journey.'+sel+'.mindset')+'</div>'+
        '<div class="f"><label>The question in their head</label>'+ta('journey.'+sel+'.question')+'</div>'+
        '<div class="f"><label>Where this stage stalls</label>'+ta('journey.'+sel+'.friction')+'</div>'+
      '</div>'+
      '<div>'+
        '<div class="f"><label>Channels</label>'+chipsOf('journey.'+sel+'.channels','vi','add a channel')+'</div>'+
        '<div class="f"><label>Assets that do the work</label>'+chipsOf('journey.'+sel+'.assets','pk','add an asset')+'</div>'+
        '<div class="f"><label>The one metric that proves this stage happened</label>'+ta('journey.'+sel+'.kpi')+'</div>'+
        '<div class="f"><label>Owner</label>'+ti('journey.'+sel+'.owner','','inp')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="co go" style="margin:4px 0 0"><span class="cot">Ask the client this, now</span>'+
      'Of these '+c.journey.length+' stages, which one loses you the most deals? Whatever they say becomes the priority for everything else, and the reason the plan in Stage 9 is ordered the way it is.</div>'+
    '</div></div>';

  const dist = '<div class="card"><header><h3>Where the accounts actually are</h3><span class="hint">live positions, from the Log Activity screen</span></header>'+
    '<div class="body">'+funnelBars()+'</div></div>';

  return signoffBlock()+
    '<div class="co pk"><span class="cot">This is a draft, not an answer</span>'+
      'The journey below was generated from the <b>'+esc((ARCHETYPES[c.archetype]||{}).label||'')+'</b> archetype and then edited against what we know about '+esc(c.name)+
      '. Switch the persona lens, change a cell, add a stage. The moment the client edits this, it stops being our deck and becomes their plan.</div>'+
    flow + lensBar + table + detail + dist;
}

function funnelBars(){
  const f=funnelData(), la=liveAccounts();
  let max = 1; f.forEach(function(x){ if(x.atOrPast>max) max=x.atOrPast; });
  return '<div class="fun">'+f.map(function(x,i){
    const vg=VG[x.vg]||VG.all;
    return '<div class="funrow"><div class="fl">'+String(i+1).padStart(2,'0')+' '+x.name+'</div>'+
      '<div class="fbar"><i style="width:'+(x.atOrPast/max*100)+'%;background:'+mix(vg.colour,.3)+'"></i>'+
        '<span>'+x.atOrPast+' reached this stage or beyond'+(x.at?' · '+x.at+' sitting here now':'')+'</span></div>'+
      '<div class="fn">'+pct(x.atOrPast,la.length)+'%</div></div>';
  }).join('')+'</div>'+
  '<div class="legend"><span><i style="background:'+mix(C.pink,.3)+'"></i>Acquisition</span>'+
  '<span><i style="background:'+mix(C.violet,.3)+'"></i>Experience</span>'+
  '<span><i style="background:'+mix(C.teal,.3)+'"></i>Retention</span>'+
  '<span><i style="background:'+mix(C.gold,.3)+'"></i>Advocacy</span></div>';
}

/* ============================================================
   15. STAGE 7: WHAT WE SAY
   ============================================================ */
function vMessaging(){
  const c = cur();
  return signoffBlock()+
  '<div class="card" style="border-left:3px solid '+C.pink+'"><header><h3>Core message</h3>'+
    '<span class="hint">one sentence the whole business can stand behind</span></header>'+
    '<div class="body"><textarea class="inp" data-set="coreMessage" rows="2" '+
      'style="font-size:19px;font-weight:680;line-height:1.45;letter-spacing:-.015em">'+esc(c.coreMessage||'')+'</textarea>'+
      '<div class="hlp">Everything below is this sentence translated for a specific person. If an audience line contradicts it, one of the two is wrong.</div></div></div>'+

  '<div class="co"><span class="cot">The rules that keep this honest</span>'+
    'Lead with the business problem before explaining the technology. Translate every acronym into an operational outcome in the same sentence. '+
    'Every claim traces back to something in Stage 1. And do not let a broad phrase like seamless connectivity or world-class service stand in for a difference, because every competitor is already saying it.</div>'+

  c.umbrellas.map(function(u){
    return '<div class="card">'+
    '<header><h3 style="flex:1">'+ti('umbrellas.'+u.id+'.name','Audience','ce')+'</h3>'+
      '<button class="xbtn" data-act="umbdel" data-id="'+u.id+'">&times;</button></header>'+
    '<div class="body">'+
      '<div class="f"><label>The line, the bit a stranger would repeat</label>'+
        '<textarea class="inp" data-set="umbrellas.'+u.id+'.line" rows="1" style="font-size:16px;font-weight:650;line-height:1.45">'+esc(u.line)+'</textarea></div>'+
      '<div class="grid2">'+
        '<div>'+
          '<div class="f"><label>Who it is aimed at</label>'+ta('umbrellas.'+u.id+'.target')+'</div>'+
          '<div class="f"><label>What it is about</label>'+ta('umbrellas.'+u.id+'.focus')+'</div>'+
          '<div class="f"><label>Proof behind it</label>'+ta('umbrellas.'+u.id+'.proof')+'</div>'+
          '<div class="f"><label>Segments</label><div class="chips">'+
            activeSegs().map(function(s){
              const on = (u.segs||[]).indexOf(s.id)>-1;
              return '<span class="chip '+(on?'sel':'')+'" data-act="umbseg" data-id="'+u.id+'" data-seg="'+s.id+'" style="cursor:pointer">'+esc(s.name)+'</span>';
            }).join('')+'</div></div>'+
        '</div>'+
        '<div>'+
          '<div class="f"><label>Supporting points</label>'+bulOf('umbrellas.'+u.id+'.supporting','A supporting point…')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="f"><label>The argument, in full</label>'+ta('umbrellas.'+u.id+'.body')+'</div>'+
    '</div></div>';
  }).join('')+
  '<button class="tbtn" data-act="umbadd">+ Add an audience message</button>'+

  '<div class="card" style="margin-top:16px"><header><h3>Opening lines</h3><span class="hint">plain, concrete, nothing that sounds like marketing</span></header>'+
  '<div class="body">'+bulOf('hooks','A hook…')+'</div></div>'+

  '<div class="card"><header><h3>Message-to-role matrix</h3><span class="hint">the same offer, argued six different ways</span></header>'+
  '<div class="body tight scrollx"><table class="tbl"><thead><tr><th style="min-width:180px">Committee role</th>'+
    '<th style="min-width:240px">The pitch that moves them</th><th style="min-width:210px">What they will push back on</th>'+
    '<th style="min-width:210px">The proof that answers it</th><th style="min-width:190px">Content to hand them</th></tr></thead><tbody>'+
  c.personas.map(function(p){
    const rc = ROLE_COL[p.crole]||C.ink;
    return '<tr><td><b>'+p.role+'</b><div class="tiny"><span class="pill" style="background:'+mix(rc,.12)+';color:'+rc+';border:1px solid '+mix(rc,.3)+'">'+(ROLE_LBL[p.crole]||'not set')+'</span></div></td>'+
    '<td class="ta">'+ta('personas.'+p.id+'.pitch','','ce')+'</td>'+
    '<td class="ta">'+ta('personas.'+p.id+'.objection','','ce')+'</td>'+
    '<td class="ta">'+ta('personas.'+p.id+'.proof','','ce')+'</td>'+
    '<td class="ta">'+ta('personas.'+p.id+'.content','','ce')+'</td></tr>';
  }).join('')+
  '</tbody></table></div></div>';
}

/* ============================================================
   16. STAGE 8: THE PLAYS, THEIR NEXT STEPS, AND THE ASSET KIT
   ============================================================ */
function vPlays(){
  const c = cur(), t = tierCounts();
  const budget = num(c.objective.budget);
  const live = c.plays.filter(function(p){return p.on;});
  const spend = playBudget();
  const ak = assetReady();
  const tierSpend = function(k){ let s=0; c.plays.forEach(function(p){ if(p.tier===k&&p.on) s+=num(p.budget); }); return s; };

  const sec = function(k){
    const list = c.plays.filter(function(p){ return p.tier===k && (S.playTier==='all'||S.playTier===k); });
    if(!list.length) return '';
    const onN = c.plays.filter(function(p){return p.tier===k&&p.on;}).length;
    const allN = c.plays.filter(function(p){return p.tier===k;}).length;
    return '<div class="card"><header><span class="pill '+TIERPILL[k]+'">'+TIERLBL[k]+'</span>'+
      '<h3 style="flex:1">'+(k==='t1'?'Built for one named account':k==='t2'?'Shared by a vertical cluster':'Programmatic air cover')+'</h3>'+
      '<span class="muted tiny">'+onN+' of '+allN+' live · '+money(tierSpend(k))+' · '+t[k]+' accounts</span></header>'+
      '<div class="body"><div class="grid3">'+list.map(function(p){
        return '<div class="play'+(p.on?'':' off')+'">'+
          '<div class="phd"><button class="sw'+(p.on?' on':'')+'" data-act="playtoggle" data-id="'+p.id+'"></button>'+
            '<h4>'+ti('plays.'+p.id+'.name','','ce')+'</h4></div>'+
          '<div class="pd">'+ta('plays.'+p.id+'.desc','','ce')+'</div>'+
          '<div class="pfield" style="margin-top:9px"><div class="pl">Primary call to action</div>'+
            '<div style="display:flex;gap:5px;align-items:flex-start"><span style="color:'+C.pink+';font-weight:800">&rsaquo;</span>'+
            ta('plays.'+p.id+'.cta','a play without a next step is content','ce')+'</div></div>'+
          '<div class="pfield"><div class="pl">Best used for</div>'+ta('plays.'+p.id+'.best','','ce')+'</div>'+
          '<div class="pm"><span class="chip tiny">'+esc(p.channel)+'</span><span class="chip tiny">'+esc(p.asset)+'</span>'+
            '<span class="chip tiny '+(p.effort==='High'?'go':p.effort==='Medium'?'vi':'te')+'">'+esc(p.effort)+' effort</span></div>'+
          '<div style="display:flex;gap:5px;align-items:center;margin-top:9px">'+
            '<span class="tiny muted" style="flex:0 0 auto">₹</span>'+
            '<input class="mini" data-set="plays.'+p.id+'.budget" data-live="1" value="'+esc(p.budget)+'" style="width:80px;font-family:var(--mono)">'+
            '<button class="chip '+(p.lock?'go':'')+'" data-act="locktoggle" data-id="'+p.id+'" '+
              'title="'+(p.lock?'Fixed. The allocator works around this number. Click to put it back on AUTO.':'Auto. Recalculated from the tier split. Type a number, or click, to fix it.')+'" '+
              'style="cursor:pointer;font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px">'+(p.lock?'FIXED':'AUTO')+'</button>'+
            '<span class="tiny muted" style="margin-left:auto">'+ti('plays.'+p.id+'.owner','owner','ce tiny')+'</span></div>'+
          (p.on?'<div class="tiny muted" style="margin-top:3px">'+pct(num(p.budget), tierTarget(p.tier))+'% of the '+TIERSHORT[p.tier]+' pool</div>':'')+
        '</div>';
      }).join('')+'</div></div></div>';
  };

  const over = spend>budget && budget>0;

  /* ---------- the allocator ---------- */
  const fixedN = c.plays.filter(function(p){return p.on&&p.lock;}).length;
  const fixedSum = c.plays.filter(function(p){return p.on&&p.lock;}).reduce(function(s,p){return s+num(p.budget);},0);
  const unalloc = budget - spend;
  const pending = Math.abs(unalloc) > 1;
  const alloc = '<div class="card" style="border-left:3px solid '+(pending?C.gold:C.violet)+'"><header><h3>Budget allocation</h3>'+
    '<span class="hint">you give one number · the app splits it · you override anything</span>'+
    '<span style="flex:1"></span>'+
    (fixedN?'<button class="tbtn" data-act="unlockall">Unlock all '+fixedN+'</button>':'')+
    '<button class="tbtn" data-act="resetsplit">Reset split</button></header>'+
    '<div class="body"><div class="grid2" style="gap:22px"><div>'+
      '<div class="f"><label>Total budget for 90 days (₹), the number they give you</label>'+
        '<input class="inp" data-set="objective.budget" data-commit="1" inputmode="numeric" value="'+esc(c.objective.budget)+'" '+
        'style="font-size:21px;font-weight:700;font-family:var(--mono)">'+
        '<div class="hlp">Type the whole figure, then press <b>Enter</b> or the button below. '+
        'Nothing recalculates while you are still typing.</div></div>'+
      '<div class="f"><label>Tier split</label>'+
        TIERS.map(function(k){
          const tgt = tierTarget(k), act = tierActual(k), lk = tierLocked(k);
          const bad = act>tgt+1;
          return '<div class="wtrow"><span class="wtn"><span class="pill '+TIERPILL[k]+'">'+TIERSHORT[k]+'</span> '+
            TIERLBL[k].split('·')[1]+
            '<div class="tiny muted">target '+money(tgt)+' · allocated <b style="color:'+(bad?C.pink:'inherit')+'">'+money(act)+'</b>'+
            (lk?' · '+money(lk)+' fixed':'')+' · '+t[k]+' accounts</div></span>'+
            '<span class="wtbar"><i style="width:'+clamp(tgt?act/tgt*100:0,0,100)+'%;background:'+(bad?C.pink:C.violet)+'"></i></span>'+
            '<input type="number" class="mini" data-set="tierSplit.'+k+'" data-commit="1" min="0" max="100" value="'+esc(getPath('tierSplit.'+k))+'" style="width:52px">'+
            '<span class="tiny muted">%</span></div>';
        }).join('')+
        '<div class="hlp">Percentages of the total. They do not have to add up to 100, since the app normalises them, so you can think in ratios if that is easier.</div></div>'+
      '<button class="tbtn '+(pending?'pk':'pri')+'" data-act="autoalloc" '+
        'style="width:100%;padding:11px;font-size:13.5px;font-weight:700;margin-top:4px">'+
        (pending?'Distribute &amp; commit '+money(num(c.objective.budget)):'Distribute &amp; commit')+'</button>'+
      '<div class="hlp" style="text-align:center">Splits the total across the tiers, then across the live plays on AUTO.</div>'+
    '</div><div>'+
      '<div class="grid2" style="gap:12px;margin-bottom:12px">'+
        '<div class="tile" style="box-shadow:none"><div class="k">Entered</div><div class="v" style="font-size:21px">'+money(budget)+'</div><div class="d">client budget</div></div>'+
        '<div class="tile '+(!pending?'te':unalloc<0?'pk':'go')+'" style="box-shadow:none"><div class="k">'+(unalloc<0?'Over by':'Not yet distributed')+'</div>'+
          '<div class="v" style="font-size:21px">'+money(Math.abs(unalloc))+'</div>'+
          '<div class="d">'+(!pending?'fully distributed':unalloc<0?'fixed amounts exceed the split':'press Distribute &amp; commit')+'</div></div>'+
      '</div>'+
      (pending?'<div class="co go"><span class="cot">Waiting on you</span>'+
        'You have entered <b>'+money(budget)+'</b> but the plays currently hold <b>'+money(spend)+'</b>. '+
        'Press <b>Distribute &amp; commit</b> to push the difference of '+money(Math.abs(unalloc))+' through the tier split.</div>':'')+
      '<div class="co"><span class="cot">How it works</span>'+
        'Every live play is on <b>AUTO</b> by default and receives a share of its tier proportional to its effort weight. '+
        'The moment you type over a play’s number it flips to <b>FIXED</b>, and the rest of that tier redistributes around it. '+
        'Switch a play off and its money returns to the pool instead of vanishing.'+
        (fixedN?' Currently <b>'+fixedN+' plays are fixed</b>, holding '+money(fixedSum)+'.':'')+'</div>'+
      (c._alloc && TIERS.some(function(k){return c._alloc[k]&&c._alloc[k].over;})
        ? '<div class="co pk"><span class="cot">Fixed amounts exceed a tier</span>'+
          'In '+TIERS.filter(function(k){return c._alloc[k]&&c._alloc[k].over;}).map(function(k){return TIERSHORT[k];}).join(' and ')+
          ', the plays you fixed already cost more than the tier split allows, so every AUTO play in that tier has dropped to zero. '+
          'Either raise the tier percentage, raise the total, or unlock something.</div>' : '')+
      '<div class="co go"><span class="cot">The honest caveat to say out loud</span>'+
        'This allocation is arithmetic, not a media plan. It tells you what each play <i>can</i> cost if you hold the tier ratio. '+
        'Real costs like a roundtable venue, a print run or a retainer go in as FIXED numbers, and the model works around them.</div>'+
    '</div></div></div></div>';

  const kit = '<div class="card" style="border-left:3px solid '+(ak.blocked?C.pink:C.teal)+'"><header><h3>Must-have asset kit</h3>'+
    '<span class="hint">nothing activates until these exist</span><span style="flex:1"></span>'+
    '<span class="muted tiny">'+ak.ready+' ready · '+ak.total+' total</span></header>'+
    '<div class="body tight scrollx"><table class="tbl"><thead><tr><th style="min-width:320px">Asset</th>'+
      '<th style="width:110px">Type</th><th style="min-width:150px">Owner</th><th style="width:140px">Status</th><th></th></tr></thead><tbody>'+
    c.assets.map(function(a){
      const cls = a.status==='Ready'?'okp':a.status==='Not started'?'bap':a.status==='In review'?'t2p':'wrp';
      return '<tr><td>'+ti('assets.'+a.id+'.name','','ce')+'</td>'+
        '<td class="tiny muted">'+esc(a.type)+'</td>'+
        '<td>'+ti('assets.'+a.id+'.owner','','ce')+'</td>'+
        '<td>'+tsel('assets.'+a.id+'.status',ASSET_STATUS,true)+' <span class="pill '+cls+'" style="margin-left:4px">'+(a.status==='Ready'?'✓':'')+'</span></td>'+
        '<td><button class="xbtn" data-act="assetdel" data-id="'+a.id+'">&times;</button></td></tr>';
    }).join('')+
    '</tbody></table></div><button class="addrow" data-act="assetadd">+ Add an asset</button></div>';

  return signoffBlock()+
  alloc+
  '<div class="grid4" style="margin-bottom:16px">'+
    '<div class="tile pk"><div class="k">Plays live</div><div class="v">'+live.length+'</div><div class="d">of '+c.plays.length+' in the library</div></div>'+

/* ============================================================

function autoKpi(k){
  const e = execTotals(), cv = coverage();
  const m = String(k.metric).toLowerCase();
  if(m.indexOf('named salesperson')>-1) return cv.ownedPct;
  if(m.indexOf('know the committee')>-1) return cv.mappedPct;
  if(m.indexOf('three or more names')>-1) return cv.threePct;
  if(m.indexOf('accounts that engaged')>-1) return e.touched;
  if(m.indexOf('people engaged per account')>-1) return cv.avgRoles;
  if(m.indexOf('real conversations')>-1 && m.indexOf('cost')===-1) return e.meetings;
  if(m.indexOf('discovery meetings')>-1) return e.meetings;
  if(m.indexOf('health checks delivered')>-1) return latestReading('health checks completed');
  if(m.indexOf('sales has accepted')>-1) return liveAccounts().filter(a=>num(a.stage)>=3).length;
  if(m.indexOf('opportunities created')>-1) return liveAccounts().filter(a=>num(a.stage)>=5).length;
  if(m.indexOf('turned up to something')>-1) return latestReading('confirmed attendees');
  if(m.indexOf('content actually read')>-1) return latestReading('downloads from target accounts');
  if(m.indexOf('visits from target accounts')>-1) return latestReading('page visits');
  if(m.indexOf('cost per engaged account')>-1) return e.touched? Math.round(playBudget()/e.touched) : null;
  if(m.indexOf('cost per real conversation')>-1) return e.meetings? Math.round(playBudget()/e.meetings) : null;
  if(m.indexOf('cost per opportunity')>-1){ const o=liveAccounts().filter(a=>num(a.stage)>=5).length; return o?Math.round(playBudget()/o):null; }
  return null;
}

    }).join(''):'<tr><td colspan="5" class="empty">No live plays.</td></tr>')+

  /* watchlist */
  const stalled = liveAccounts().filter(function(a){return tierOf(a)!=='t3' && num(a.stage)<=1;}).sort(function(a,b){return scoreOf(b)-scoreOf(a);});

      '<td class="tiny muted">'+esc(c.journey[num(a.stage)]?c.journey[num(a.stage)].name:'-')+'</td>'+
      '<td class="num">'+(a.roles||[]).length+' roles</td>'+
      '<td class="num">'+num(a.touches)+' touches</td></tr>';
    }).join('')+'</tbody></table>':'<div class="empty">Nothing stalled. Enjoy it while it lasts.</div>')+'</div></div>'+
    '<div class="card"><header><h3>Closest to commercial</h3><span class="hint">validation stage or beyond</span></header>'+
    '<div class="body tight">'+(hot.length?'<table class="tbl"><tbody>'+hot.slice(0,12).map(function(a){
      return '<tr><td><b>'+esc(a.name)+'</b><div class="tiny muted">'+esc((segById(a.seg)||{}).name||'')+'</div></td>'+
      '<td><span class="pill '+TIERPILL[tierOf(a)]+'">'+TIERSHORT[tierOf(a)]+'</span></td>'+
      '<td class="tiny"><b>'+esc(c.journey[num(a.stage)]?c.journey[num(a.stage)].name:'-')+'</b></td>'+
      '<td class="num">'+(a.roles||[]).length+' roles</td>'+
      '<td class="num">'+num(a.meetings)+' mtgs</td></tr>';
    }).join('')+'</tbody></table>':'<div class="empty">Nothing in validation yet.</div>')+'</div></div>'+
  '</div>';

  return '<div class="co pk"><span class="cot">This is the retainer</span>'+
    'The strategy is why this screen exists. This screen is what '+esc(c.name)+' gets every Monday morning. All of it comes from what the team logs on the next tab, so none of it is typed into a slide by hand.'+
    (ak.blocked?' <b>'+ak.blocked+' must-have assets have not started</b>, which caps what the rest of these numbers can do.':'')+'</div>'+
    tiles + covCard + funnel + hm + kpiCard + perf + watch;
}

     'Sales agrees to pursue an account before we spend a rupee personalising anything for it.',

    .map(function(x){ return '<div style="display:flex;gap:9px;font-size:12.5px;line-height:1.55"><span style="color:'+C.pink+';font-weight:800">&mdash;</span><span>'+esc(x)+'</span></div>'; }).join('')+

/* ============================================================
   22. RENDER DISPATCH
